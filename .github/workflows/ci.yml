# Tests on every push and pull request. No secrets, read-only token.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (pinned)
        run: |
          ldconfig -p | grep -q 'libgomp\.so\.1' || sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      # Includes the export contract (JSON Schema), the "no odds / no source data" check and the
      # independent export-vs-database verifier (tests/test_export*.py).
      # Deselected: test_total_outputs_unchanged_synthetic compares a sha256 of fitted-model outputs
      # (rounded to 1e-9) with a value recorded on Windows. The fit differs in the last bits on Linux
      # (other BLAS / libm), so the hash can never match here. To be replaced by a tolerance-based
      # check by the model owner; until then it only runs on the development machine.
      - name: Tests (without the browser accessibility audits)
        run: >-
          python -m pytest -q -m "not a11y"
          --deselect "tests/test_models_team.py::test_total_outputs_unchanged_synthetic"

  a11y:
    name: Accessibility audits (optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true  # informative: never blocks a merge
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (pinned) and Playwright with Chromium
        run: |
          ldconfig -p | grep -q 'libgomp\.so\.1' || sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium

      - name: Accessibility tests
        run: python -m pytest -q -m a11y

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a frontend?
        id: frontend
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found: nothing to check."
          fi

      - name: Set up Node
        if: ${{ steps.frontend.outputs.present == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: frontend
        run: npm run lint --if-present

      - name: Unit tests
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: frontend
        run: npm run test --if-present

      - name: Build
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: frontend
        run: npm run build
