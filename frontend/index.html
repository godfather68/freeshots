<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Calibrated lower bounds on total shots for upcoming football matches." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Shots board</title>
    <script>try{var t=JSON.parse(localStorage.getItem('shots.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript to show the match board.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
