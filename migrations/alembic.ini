# Alembic config for data/shots.db. Prefer `python -m shots.db upgrade`; this file is for the
# alembic CLI: `alembic -c migrations/alembic.ini upgrade head` (target DB: SHOTS_DB or data/shots.db).
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
