[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shots"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shots.ingest" = ["*.csv"]
"shots.auth" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["a11y: browser accessibility audits (Playwright + axe-core); skipped when Chromium is not installed"]
